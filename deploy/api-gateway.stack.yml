# Stack de api-gateway para Portainer (Docker Swarm).
#
# Se despliega con `docker stack deploy` (lo que hace Portainer en modo Swarm),
# NO con `docker compose up`: la clave `deploy` y las `deploy.labels` que lee
# Traefik solo las honra el modo Swarm, y la red `default` es overlay.
version: '3.8'

services:
  api-gateway:
    image: ghcr.io/andesworkforce/api_gateway:latest
    networks:
      - traefik-public
      - nats_nats_internal_network
      - default
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        # SOLO la label swarm. NO agregar `traefik.docker.network`: Traefik v3
        # aborta el servicio con
        #   ERR Skip container error="both Docker and Swarm labels are defined"
        # si encuentra labels `traefik.docker.*` y `traefik.swarm.*` juntas. No
        # elige una: descarta el servicio, no crea router, y el dominio pasa a
        # devolver `404 page not found` pelado en todos los paths.
        # El cert de Let's Encrypt sobrevive en acme.json y disimula el problema.
        - "traefik.swarm.network=traefik-public"
        # OJO al editar esta regla: una regla que Traefik no puede parsear NO
        # crea el router, y el sintoma es el mismo 404 pelado que una label mal
        # puesta. Ya paso una vez con sintaxis de link markdown pegada adentro:
        #   Host(`api.[www.pulse-aw.com](https://www.pulse-aw.com)`)
        # El gateway responde en UN solo host. `api.www.pulse-aw.com` no existe.
        - "traefik.http.routers.api-gateway.rule=Host(`api.pulse-aw.com`)"
        - "traefik.http.routers.api-gateway.entrypoints=websecure"
        - "traefik.http.routers.api-gateway.tls=true"
        - "traefik.http.routers.api-gateway.tls.certresolver=letsencrypt"
        - "traefik.http.routers.api-gateway.service=api-gateway"
        - "traefik.http.services.api-gateway.loadbalancer.server.port=3001"
      restart_policy:
        condition: on-failure
        delay: 5s
        # SIN max_attempts a proposito. Con `max_attempts: 3` Swarm abandonaba el
        # servicio para siempre tras 3 crashes seguidos y lo dejaba en 0/1
        # replicas: Traefik entonces quita el router y el dominio pasa a devolver
        # `404 page not found` pelado en todos los paths, mientras el cert de
        # Let's Encrypt sigue en acme.json y hace parecer que todo esta bien.
        # `window` acota los reintentos sin volverlos finitos.
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      # Limites PROD (tabla interna: API NestJS)
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    environment:
      NODE_ENV: production
      PORT: "${PORT:-3001}"

      # NATS
      NATS_HOST: nats-prod
      NATS_PORT: "4222"
      NATS_USERNAME: "${NATS_USERNAME}"
      NATS_PASSWORD: "${NATS_PASSWORD}"

      # OBLIGATORIA y faltaba. config/envs.ts la valida con Joi
      # `.required()` sobre process.env al importarse el modulo, asi que su
      # ausencia tira `Invalid environment variables` antes de que arranque Nest.
      # Debe coincidir con el JWT_SECRET_PASSWORD del agente y del resto de los MS.
      JWT_SECRET_PASSWORD: "${JWT_SECRET_PASSWORD}"

      ENVIRONMENT: "${ENVIRONMENT:-production}"
      DEV_LOGS: "${DEV_LOGS:-false}"

      THROTTLE_TTL: "${THROTTLE_TTL:-60000}"
      THROTTLE_LIMIT: "${THROTTLE_LIMIT:-100}"
      THROTTLE_AUTH_LOGIN_TTL: "${THROTTLE_AUTH_LOGIN_TTL:-60000}"
      THROTTLE_AUTH_LOGIN_LIMIT: "${THROTTLE_AUTH_LOGIN_LIMIT:-5}"
      THROTTLE_AUTH_REGISTER_TTL: "${THROTTLE_AUTH_REGISTER_TTL:-300000}"
      THROTTLE_AUTH_REGISTER_LIMIT: "${THROTTLE_AUTH_REGISTER_LIMIT:-20}"
      THROTTLE_AUTH_REFRESH_TTL: "${THROTTLE_AUTH_REFRESH_TTL:-60000}"
      THROTTLE_AUTH_REFRESH_LIMIT: "${THROTTLE_AUTH_REFRESH_LIMIT:-10}"
      THROTTLE_AGENT_HEARTBEAT_TTL: "${THROTTLE_AGENT_HEARTBEAT_TTL:-60000}"
      THROTTLE_AGENT_HEARTBEAT_LIMIT: "${THROTTLE_AGENT_HEARTBEAT_LIMIT:-30}"
      THROTTLE_AGENT_REGISTER_TTL: "${THROTTLE_AGENT_REGISTER_TTL:-60000}"
      THROTTLE_AGENT_REGISTER_LIMIT: "${THROTTLE_AGENT_REGISTER_LIMIT:-100}"

      CORS_ORIGINS: "https://www.pulse-aw.com,https://pulse-aw.com"

networks:
  default:
    name: andes-api-gateway-net
    driver: overlay

  traefik-public:
    external: true

  nats_nats_internal_network:
    external: true
